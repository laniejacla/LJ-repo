<title>Bloom Studio</title>
<meta name="description" content="Step-by-step picture guides that grow young artists from first crayon lines to real paintings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a studio table. Choices on the left, one big sheet of paper on the right,
   the paper always stays white because it is the child's paper, in any theme.
   Tokens share names with Flora so the module inherits Flora's theme when embedded. */
:root{
  --paper:#FAF7EF; --card:#FFFFFF; --ink:#2E2A22; --soft:#6E685C;
  --moss:#47533D; --moss-deep:#3B4633; --sage:#8CA079; --sage-pale:#E7EDE0;
  --clay:#C08A6E; --clay-pale:#F5E7DF; --line:#E4DFD2; --line-soft:#EFEBE0;
  --sun:#F2B33D; --sun-pale:#FCEFD2; --berry:#D2566B; --sky:#4F86C6;
  --sheet:#FFFFFF; --sheet-ink:#2B2622; --fresh:#E2673A;
  --display:'Fredoka','Karla',system-ui,sans-serif;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1D1F1A; --card:#25281F; --ink:#EDE9DE; --soft:#A8A294;
  --moss:#3E4A34; --moss-deep:#33402A; --sage:#9DB189; --sage-pale:#2F3A28;
  --clay:#CE9878; --clay-pale:#3B2E26; --line:#393D31; --line-soft:#32362B;
  --sun:#E8AE45; --sun-pale:#3A3122; --berry:#E07487; --sky:#7FA9DB; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1D1F1A; --card:#25281F; --ink:#EDE9DE; --soft:#A8A294;
  --moss:#3E4A34; --moss-deep:#33402A; --sage:#9DB189; --sage-pale:#2F3A28;
  --clay:#CE9878; --clay-pale:#3B2E26; --line:#393D31; --line-soft:#32362B;
  --sun:#E8AE45; --sun-pale:#3A3122; --berry:#E07487; --sky:#7FA9DB; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--sans)}

.bs{font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink);
  max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
.bs *{box-sizing:border-box}
.bs button{font:inherit;color:inherit;cursor:pointer}
.bs button:focus-visible,.bs input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bs h1,.bs h2,.bs h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}

/* top bar */
.bs-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.bs-brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.bs-brand svg{width:44px;height:44px;flex:none}
.bs-brand h1{font-size:1.6rem;line-height:1;letter-spacing:-.01em}
.bs-brand p{margin:2px 0 0;color:var(--soft);font-size:.86rem}
.bs-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.bs-tabs button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem;color:var(--soft)}
.bs-tabs button[aria-selected="true"]{background:var(--moss);color:#F7F4EA}
.bs-artist{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--soft)}
.bs-artist input{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;width:9.5em}

/* studio layout */
.bs-studio{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.bs-studio{grid-template-columns:minmax(0,1fr)}.bs-stage{order:-1}}
.bs-jump{display:none}
@media(max-width:900px){.bs-jump{display:inline-flex}}
.bs-pick{display:flex;flex-direction:column;gap:14px}
.bs-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.bs-box h2{font-size:1.02rem;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.bs-box h2 small{font-family:var(--sans);font-weight:500;font-size:.78rem;color:var(--soft)}
.bs-chips{display:flex;flex-wrap:wrap;gap:6px}
.bs-chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;
  font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.bs-chip:hover{border-color:var(--sage)}
.bs-chip[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#F7F4EA}
.bs-chip svg{width:22px;height:22px;flex:none}

.bs-subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.bs-subj{border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:4px 2px 5px;
  display:flex;flex-direction:column;align-items:center;gap:0;color:var(--sheet-ink)}
.bs-subj svg{width:100%;aspect-ratio:1;max-width:72px}
.bs-subj span{font-size:.72rem;font-weight:700;color:#5b554b}
.bs-subj[aria-pressed="true"]{border-color:var(--fresh);box-shadow:0 0 0 2px var(--fresh)}

.bs-levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bs-lvl{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:8px 10px;text-align:left;
  display:grid;grid-template-columns:30px 1fr;gap:0 8px;align-items:center}
.bs-lvl svg{grid-row:span 2;width:30px;height:30px}
.bs-lvl b{font-family:var(--display);font-weight:600;font-size:.95rem}
.bs-lvl span{font-size:.74rem;color:var(--soft)}
.bs-lvl[aria-pressed="true"]{background:var(--sage-pale);border-color:var(--moss)}

.bs-techs{display:flex;flex-direction:column;gap:6px}
.bs-tech{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:8px 10px;text-align:left;
  display:grid;grid-template-columns:40px 1fr;gap:0 10px;align-items:center}
.bs-tech .sw{grid-row:span 2;width:40px;height:40px;border-radius:12px}
.bs-tech b{font-family:var(--display);font-weight:600;font-size:.95rem}
.bs-tech span{font-size:.76rem;color:var(--soft)}
.bs-tech[aria-pressed="true"]{background:var(--sun-pale);border-color:var(--sun)}

.bs-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bs-sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.bs-sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--fresh)}

/* stage */
.bs-stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.bs-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:12px}
.bs-head h2{font-size:1.5rem;line-height:1.15}
.bs-head .meta{color:var(--soft);font-size:.88rem;margin-top:2px}
.bs-views{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.bs-views button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 11px;font-size:.84rem;font-weight:600}
.bs-views button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.bs-need{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;margin-bottom:14px}
.bs-need b{font-family:var(--display);font-weight:600;color:var(--soft);margin-right:2px}
.bs-need span{background:var(--line-soft);border-radius:8px;padding:3px 9px}

.bs-step{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:700px){.bs-step{grid-template-columns:minmax(0,1fr)}}
.bs-sheet{background:var(--sheet);border-radius:16px;box-shadow:0 1px 0 var(--line),0 8px 24px -14px rgba(40,30,10,.35);
  border:1px solid var(--line);overflow:hidden;position:relative;aspect-ratio:1;max-width:100%}
.bs-sheet svg{display:block;width:100%;height:100%}
.bs-count{font-family:var(--display);font-weight:600;color:var(--fresh);font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.bs-say h3{font-size:1.45rem;line-height:1.2;margin:4px 0 8px}
.bs-say p{margin:0 0 12px;font-size:1.02rem;max-width:60ch}
.bs-tip{background:var(--sun-pale);border-radius:14px;padding:10px 12px;font-size:.92rem;display:flex;gap:10px;margin-bottom:12px}
.bs-tip svg{flex:none;width:22px;height:22px;margin-top:1px}
.bs-feel{background:var(--sage-pale);border-radius:14px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
.bs-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.bs .bs-btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.95rem;background:var(--moss);color:#F7F4EA;min-height:44px}
.bs .bs-btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.bs .bs-btn.hot{background:var(--fresh);color:#fff}
.bs-btn:disabled{opacity:.4;cursor:default}
.bs-dots{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0 4px}
.bs-dots button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:.72rem;font-weight:700;padding:0}
.bs-dots button.done{background:var(--sage-pale);border-color:var(--sage)}
.bs-dots button[aria-current="step"]{background:var(--fresh);border-color:var(--fresh);color:#fff}
.bs-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--soft);margin-top:8px}
.bs-key i{display:inline-block;width:18px;height:0;border-top:3px solid var(--fresh);vertical-align:middle;margin-right:5px}
.bs-key i.dash{border-top-style:dashed;border-color:#7FA9DB}

.bs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bs-cell{display:flex;flex-direction:column;gap:6px}
.bs-cell .bs-sheet{border-radius:12px}
.bs-cell p{margin:0;font-size:.82rem;line-height:1.3}
.bs-cell p b{font-family:var(--display);color:var(--fresh);margin-right:4px}
.bs-cell button{border:0;background:none;padding:0;text-align:left}

/* color guide */
.bs-colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bs-recipe{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center}
.bs-recipe .res{grid-row:span 2;width:52px;height:52px;border-radius:50% 46% 52% 44%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.bs-recipe b{font-family:var(--display);font-weight:600}
.bs-recipe .why{font-size:.74rem;color:var(--soft)}
.bs-drops{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:.78rem}
.bs-drop{border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.bs-sec{margin:20px 0 10px;font-size:1.1rem}
.bs-band{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.bs-band div{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;font-size:.8rem;font-weight:600}
.bs-lesson{font-size:.92rem;max-width:68ch;color:var(--soft);margin:0 0 10px}

/* practice pad */
.bs-pad{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px}
@media(max-width:700px){.bs-pad{grid-template-columns:minmax(0,1fr)}}
.bs-padsheet{position:relative;aspect-ratio:1;background:var(--sheet);border-radius:16px;border:1px solid var(--line);overflow:hidden;touch-action:none}
.bs-padsheet img,.bs-padsheet canvas{position:absolute;inset:0;width:100%;height:100%}
.bs-padsheet img{opacity:.22;pointer-events:none}
.bs-tools{display:flex;flex-direction:column;gap:10px}
.bs-tools h3{font-size:.95rem}
.bs-sizes{display:flex;gap:6px}
.bs-sizes button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.bs-sizes button[aria-pressed="true"]{border-color:var(--ink)}
.bs-sizes i{display:block;border-radius:50%;background:var(--ink)}

/* color lab */
.bs-lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media(max-width:900px){.bs-lab{grid-template-columns:minmax(0,1fr)}}
.bs-pots{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.bs-pot{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:0}
.bs-pot i{width:54px;height:54px;border-radius:50% 50% 46% 46%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 0 0 2px var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem}
.bs-bowl{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bs-bowl .blob{width:120px;height:120px;border-radius:52% 48% 50% 46%;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08),0 0 0 2px var(--line);flex:none;transition:background .3s}
.bs-meter{height:12px;border-radius:999px;background:var(--line-soft);overflow:hidden;margin:6px 0}
.bs-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--berry),var(--sun),var(--sage));transition:width .3s}
.bs-wheel svg{width:100%;max-width:360px;display:block;margin:0 auto}
.bs-ladder{display:flex;border-radius:12px;overflow:hidden;margin:6px 0 12px}
.bs-ladder div{flex:1;height:38px}
.bs-pairs{display:flex;gap:10px;flex-wrap:wrap}
.bs-pair{display:flex;border-radius:12px;overflow:hidden;width:96px;height:44px}
.bs-pair div{flex:1}
.bs-skies{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}

/* garden */
.bs-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:20px}
.bs-badge{border:1.5px dashed var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;opacity:.72}
.bs-badge.got{border-style:solid;border-color:var(--sun);background:var(--sun-pale);opacity:1}
.bs-badge svg{width:40px;height:40px;flex:none}
.bs-badge b{font-family:var(--display);font-weight:600;display:block;font-size:.92rem}
.bs-badge span{font-size:.74rem;color:var(--soft)}
.bs-empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--soft)}
.bs-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:.88rem}

/* celebration */
.bs-party{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.bs-party i{position:absolute;top:-20px;width:14px;height:10px;border-radius:50% 0;animation:bsfall 2.4s ease-in forwards}
@keyframes bsfall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.bs-party{display:none}.bs-bowl .blob{transition:none}}
.bs-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:60}
@media print{
  .bs-top,.bs-pick,.bs-views,.bs-nav,.bs-dots,.bs-need{display:none!important}
  .bs-studio{display:block}.bs-stage{border:0}
}
</style>

<div class="bs" id="bloom-studio"></div>

<script>
/* Bloom Studio. Self-contained: call BloomStudio.mount(element) to place it anywhere,
   including inside Flora. Every guide is drawn from the data below, so a new subject,
   feeling or technique is a data entry rather than a new picture. */
(function(){
"use strict";

/* ───────────── paint mixing ─────────────
   Kids mix with red, yellow, blue, white and black. Mixing happens in RYB space
   (the painter's wheel) so red + yellow really gives orange and blue + yellow gives
   green, then white tints and black shades. Every swatch below is computed from its
   recipe, so the recipe a child follows is the color they see. */
const CUBE=[[1,1,1],[1,0,0],[1,1,0],[1,.5,0],[.1,.38,.82],[.52,.12,.62],[0,.66,.2],[.2,.094,0]];
function ryb(r,y,b){const w=[(1-r)*(1-y)*(1-b),r*(1-y)*(1-b),(1-r)*y*(1-b),r*y*(1-b),(1-r)*(1-y)*b,r*(1-y)*b,(1-r)*y*b,r*y*b];
  return [0,1,2].map(c=>w.reduce((s,wi,i)=>s+wi*CUBE[i][c],0))}
const PAINTS={R:{n:"red",hex:"#E3262E"},Y:{n:"yellow",hex:"#FFD21F"},B:{n:"blue",hex:"#1F5FC9"},W:{n:"white",hex:"#FFFFFF"},K:{n:"black",hex:"#1E1C22"}};
function parse(rec){const p={R:0,Y:0,B:0,W:0,K:0};rec.replace(/([RYBWK])([\d.]+)/g,(_,k,n)=>{p[k]+=+n});return p}
function mixParts(p){const T=p.R+p.Y+p.B+p.W+p.K;if(!T)return"#FFFFFF";const C=p.R+p.Y+p.B;let rgb;
  if(C>0){const m=Math.max(p.R,p.Y,p.B);rgb=ryb(p.R/m,p.Y/m,p.B/m);const w=Math.pow(p.W/T,1.5)*.94,k=Math.min(1,p.K/T*1.9);
    rgb=rgb.map(v=>v+(1-v)*w).map((v,i)=>v+([.11,.1,.12][i]-v)*k)}
  else{const k=Math.pow(p.K/T,.7);rgb=[1,1,1].map((v,i)=>v+([.11,.1,.12][i]-v)*k)}
  return hex(rgb)}
const mix=rec=>mixParts(parse(rec));
function hex(rgb){return"#"+rgb.map(v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,"0")).join("")}
function rgbOf(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255)}
function lerp(a,b,t){const A=rgbOf(a),B=rgbOf(b);return hex(A.map((v,i)=>v+(B[i]-v)*t))}
const lighten=(h,t)=>lerp(h,"#FFFFFF",t), darken=(h,t)=>lerp(h,"#1E1C22",t);

/* The color library: name, recipe in parts, and a word on why it works. */
const LIB={
 red:["Red","R1","Straight from the tube."], yellow:["Yellow","Y1","Straight from the tube."], blue:["Blue","B1","Straight from the tube."],
 white:["White","W1","Straight from the tube."], black:["Black","K1","Use just a little. It is strong!"],
 orange:["Orange","R1 Y1","The two warm primaries make orange."], green:["Green","Y1 B1","Yellow and blue are best friends."],
 purple:["Purple","R1 B1","Red and blue make purple."],
 tan:["Puppy tan","Y3 R2 B.6 W2","A tiny bit of blue calms bright orange into tan."],
 brown:["Brown","R2 Y2 B1","All three primaries together make brown."],
 darkBrown:["Dark brown","R2 Y2 B1 K1","Brown with a dot of black."],
 cream:["Cream","Y1 R.2 W6","Lots of white, a little sunshine."],
 golden:["Golden yellow","Y4 R1","A drop of red warms yellow up."],
 ginger:["Ginger","Y3 R2 W1","Orange with extra yellow and a little white."],
 pink:["Pink","R1 W3","Red plus white makes pink."], lightPink:["Blush pink","R1 W6","Even more white for a soft blush."],
 coral:["Coral","R2 Y1 W1","Red-orange with a little white."],
 peach:["Peach","R1 Y1 W4","Orange softened with white."],
 leaf:["Leaf green","Y2 B1","More yellow makes a fresh spring green."],
 darkGreen:["Forest green","Y2 B1 K1","Green with black for shady leaves."],
 lightGreen:["Light green","Y3 B1 W2","Leaf green with white."],
 lime:["Lime","Y4 B1","Lots of yellow, a little blue."],
 mint:["Mint","Y1 B1 W4","Green made soft with white."],
 sky:["Sky blue","B1 W3","Blue with white, like a clear morning."],
 lightSky:["Pale sky","B1 W6","Blue with lots of white near the horizon."],
 navy:["Navy","B3 R.5 K1","Blue with a dot of red and black for night."],
 midnight:["Midnight","B2 R1 K2","Deep purple-blue for the top of a night sky."],
 teal:["Teal","B2 Y1","Mostly blue with a little yellow."],
 lavender:["Lavender","R1 B1 W4","Purple plus white."], lilac:["Lilac","R1 B2 W3","Blue-purple plus white."],
 violet:["Violet","R1 B2","Purple that leans blue."],
 magenta:["Magenta","R3 B1","Mostly red with a little blue."],
 plum:["Plum","R2 B1 K.4","Red-purple, a little darker."],
 gray:["Soft gray","K1 W5","Black and white make gray."],
 charcoal:["Charcoal","K3 W1","Almost black, but softer."],
 terracotta:["Terracotta","R2 Y1 B.4 W1","Clay-pot orange: orange with a touch of blue."],
 snow:["Snow white","W8 K.1 B.1","White with a whisper of blue so it shows on paper."],
 paleYellow:["Butter","Y1 W3","Yellow with white."]
};
const col=k=>mix(LIB[k][1]);
const recText=rec=>Object.entries(parse(rec)).filter(([,n])=>n>0).map(([c,n])=>(n<1?"a dot of":n)+" "+PAINTS[c].n).join(" + ");

/* ───────────── shape helpers ─────────────
   Every subject sits in a 200 × 200 box. Paths use only M L Q C Z so they can be
   mirrored by flipping x around the center line. */
const E=(cx,cy,rx,ry,c)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" data-c="${c}"/>`;
const O=(cx,cy,r,c)=>E(cx,cy,r,r,c);
const P=(d,c)=>`<path d="${d}" data-c="${c}"/>`;
const L=d=>`<path d="${d}" data-c="none"/>`;
function flip(d){let i=0;return d.replace(/-?\d+(\.\d+)?/g,n=>(i++%2===0)?String(+(200-n).toFixed(1)):n)}
function flipEl(el){return el.replace(/d="([^"]+)"/,(_,d)=>`d="${flip(d)}"`).replace(/cx="([\d.]+)"/,(_,x)=>`cx="${+(200-x).toFixed(1)}"`)}
const pair=el=>el+flipEl(el);
const pt=(cx,cy,r,deg)=>{const a=deg*Math.PI/180;return(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1)};
function petals(cx,cy,n,r0,r1,spread,c){let s="";for(let i=0;i<n;i++){const a=i*360/n-90;
  s+=P(`M${pt(cx,cy,r0,a-spread)} Q${pt(cx,cy,r1*.86,a-spread*.85)} ${pt(cx,cy,r1,a)} Q${pt(cx,cy,r1*.86,a+spread*.85)} ${pt(cx,cy,r0,a+spread)} Z`,c)}return s}
function rays(cx,cy,n,r0,r1,c){let s="";for(let i=0;i<n;i++){const a=i*360/n;s+=P(`M${pt(cx,cy,r0,a-9)} L${pt(cx,cy,r1,a)} L${pt(cx,cy,r0,a+9)} Z`,c)}return s}
const drop=(x,y,c)=>P(`M${x} ${y} C${x-6} ${y+9} ${x-5} ${y+15} ${x} ${y+15} C${x+5} ${y+15} ${x+6} ${y+9} ${x} ${y} Z`,c);

function face(sub,emo,ink,opts){
  const f=sub.face,s=f.s,x=f.x,y=f.y,my=f.my||y+18*s,L=x-f.dx,R=x+f.dx;
  const st=`stroke="${ink}" stroke-width="${2.6*s+.6}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  const dot=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${ink}"/>`;
  const shine=(cx,cy,r)=>`<circle cx="${cx-r*.35}" cy="${cy-r*.4}" r="${r*.35}" fill="#fff"/>`;
  const eye=(cx,r=4.6*s)=>dot(cx,y,r)+(opts.shine?shine(cx,y,r):"");
  const big=(cx,r=7*s,pr=2.6*s)=>`<circle cx="${cx}" cy="${y}" r="${r}" fill="#fff" ${st}/>`+dot(cx,y+1*s,pr);
  const cheeks=(c="#F4A3B0")=>opts.cheeks?`<ellipse cx="${L-6*s}" cy="${y+10*s}" rx="${5.5*s}" ry="${3.2*s}" fill="${c}" opacity=".75"/><ellipse cx="${R+6*s}" cy="${y+10*s}" rx="${5.5*s}" ry="${3.2*s}" fill="${c}" opacity=".75"/>`:"";
  const mouth=f.mouth!==false;
  const smile=(w=8,d=7)=>mouth?`<path d="M${x-w*s} ${my-2*s} Q${x} ${my+d*s} ${x+w*s} ${my-2*s}" ${st}/>`:"";
  const heart=(cx,cy,r)=>`<path d="M${cx} ${cy+r} C${cx-r*1.6} ${cy} ${cx-r} ${cy-r*1.2} ${cx} ${cy-r*.3} C${cx+r} ${cy-r*1.2} ${cx+r*1.6} ${cy} ${cx} ${cy+r} Z" fill="#E2405A"/>`;
  const closed=(cx,up)=>`<path d="M${cx-5*s} ${y} Q${cx} ${y+(up?-5:5)*s} ${cx+5*s} ${y}" ${st}/>`;
  let o="";
  switch(emo){
   case"happy":o=eye(L)+eye(R)+smile()+cheeks();break;
   case"excited":o=`<path d="M${L-5*s} ${y+2*s} L${L} ${y-4*s} L${L+5*s} ${y+2*s} M${R-5*s} ${y+2*s} L${R} ${y-4*s} L${R+5*s} ${y+2*s}" ${st}/>`
     +(mouth?`<path d="M${x-8*s} ${my-3*s} L${x+8*s} ${my-3*s} Q${x+8*s} ${my+9*s} ${x} ${my+9*s} Q${x-8*s} ${my+9*s} ${x-8*s} ${my-3*s} Z" fill="${ink}"/><ellipse cx="${x}" cy="${my+5*s}" rx="${4*s}" ry="${2.6*s}" fill="#F47C8A"/>`:"")+cheeks();break;
   case"calm":o=closed(L,true)+closed(R,true)+smile(5,4)+cheeks();break;
   case"love":o=heart(L,y,5*s)+heart(R,y,5*s)+smile()+cheeks()+heart(R+18*s,y-18*s,3.5*s)+heart(R+26*s,y-28*s,2.5*s);break;
   case"silly":o=eye(L)+`<path d="M${R-4*s} ${y-4*s} L${R+4*s} ${y} L${R-4*s} ${y+4*s}" ${st}/>`+smile()
     +(mouth?`<path d="M${x-1*s} ${my+1.5*s} Q${x+1*s} ${my+11*s} ${x+6*s} ${my+8*s} Q${x+7*s} ${my+3*s} ${x+5*s} ${my+.5*s} Z" fill="#F47C8A" stroke="${ink}" stroke-width="${1.6*s+.4}"/>`:"")+cheeks();break;
   case"surprised":o=big(L)+big(R)+`<path d="M${L-6*s} ${y-12*s} Q${L} ${y-17*s} ${L+6*s} ${y-12*s} M${R-6*s} ${y-12*s} Q${R} ${y-17*s} ${R+6*s} ${y-12*s}" ${st}/>`
     +(mouth?`<ellipse cx="${x}" cy="${my+2*s}" rx="${4*s}" ry="${5.5*s}" fill="${ink}"/>`:"");break;
   case"shy":o=dot(L+2.5*s,y+1*s,4*s)+dot(R+2.5*s,y+1*s,4*s)
     +(mouth?`<path d="M${x-5*s} ${my} Q${x-2.5*s} ${my-3*s} ${x} ${my} Q${x+2.5*s} ${my+3*s} ${x+5*s} ${my}" ${st}/>`:"")
     +`<path d="M${L-10*s} ${y+12*s} L${L-7*s} ${y+7*s} M${L-5*s} ${y+12*s} L${L-2*s} ${y+7*s} M${R+2*s} ${y+12*s} L${R+5*s} ${y+7*s} M${R+7*s} ${y+12*s} L${R+10*s} ${y+7*s}" stroke="#E2607A" stroke-width="${2*s}" stroke-linecap="round"/>`;break;
   case"sleepy":o=closed(L,false)+closed(R,false)+(mouth?`<ellipse cx="${x}" cy="${my+1*s}" rx="${3*s}" ry="${3.4*s}" fill="none" ${st.replace('fill="none"',"")}/>`:"")
     +`<text x="${R+14*s}" y="${y-14*s}" font-family="Fredoka,sans-serif" font-weight="600" font-size="${12*s}" fill="${ink}">z</text><text x="${R+22*s}" y="${y-24*s}" font-family="Fredoka,sans-serif" font-weight="600" font-size="${16*s}" fill="${ink}">Z</text>`+cheeks();break;
   case"sad":o=eye(L,4.2*s)+eye(R,4.2*s)+`<path d="M${L-6*s} ${y-8*s} L${L+5*s} ${y-12*s} M${R+6*s} ${y-8*s} L${R-5*s} ${y-12*s}" ${st}/>`
     +(mouth?`<path d="M${x-7*s} ${my+4*s} Q${x} ${my-4*s} ${x+7*s} ${my+4*s}" ${st}/>`:"")
     +`<path d="M${L} ${y+6*s} C${L-3*s} ${y+11*s} ${L-3*s} ${y+15*s} ${L} ${y+15*s} C${L+3*s} ${y+15*s} ${L+3*s} ${y+11*s} ${L} ${y+6*s} Z" fill="#6FB2E8"/>`;break;
   case"scared":o=big(L,7*s,1.8*s)+big(R,7*s,1.8*s)+`<path d="M${L-6*s} ${y-12*s} Q${L} ${y-15*s} ${L+6*s} ${y-11*s} M${R+6*s} ${y-12*s} Q${R} ${y-15*s} ${R-6*s} ${y-11*s}" ${st}/>`
     +(mouth?`<path d="M${x-9*s} ${my+1*s} L${x-5*s} ${my-2*s} L${x-1.5*s} ${my+1*s} L${x+1.5*s} ${my-2*s} L${x+5*s} ${my+1*s} L${x+9*s} ${my-2*s}" ${st}/>`:"")
     +`<path d="M${R+16*s} ${y-14*s} C${R+12*s} ${y-6*s} ${R+13*s} ${y-2*s} ${R+16*s} ${y-2*s} C${R+19*s} ${y-2*s} ${R+20*s} ${y-6*s} ${R+16*s} ${y-14*s} Z" fill="#8EC7EE"/>`;break;
   case"angry":o=eye(L,4.2*s)+eye(R,4.2*s)+`<path d="M${L-6*s} ${y-12*s} L${L+6*s} ${y-6*s} M${R+6*s} ${y-12*s} L${R-6*s} ${y-6*s}" ${st}/>`
     +(mouth?`<path d="M${x-7*s} ${my+3*s} Q${x} ${my-3*s} ${x+7*s} ${my+3*s}" ${st}/>`:"")+cheeks("#F08A7A");break;
   default:o=eye(L,4*s)+eye(R,4*s);
  }
  return `<g class="face">${o}</g>`;
}

const EXTRAS=[{id:"none",n:"Nothing"},{id:"bow",n:"Bow"},{id:"hat",n:"Party hat"},{id:"crown",n:"Flower crown"},{id:"glasses",n:"Glasses"}];
function extra(sub,id,ink,color){
  const h=sub.head,x=h.x,y=h.y,w=h.w,sw=`stroke="${ink}" stroke-width="2.4" stroke-linejoin="round"`;
  const c=k=>color?col(k):"#fff";
  if(id==="bow"){const bx=x+w*.32,by=y+4;return`<path d="M${bx} ${by} L${bx-14} ${by-9} L${bx-14} ${by+9} Z M${bx} ${by} L${bx+14} ${by-9} L${bx+14} ${by+9} Z" fill="${c("pink")}" ${sw}/><circle cx="${bx}" cy="${by}" r="4" fill="${c("magenta")}" ${sw}/>`}
  if(id==="hat"){return`<path d="M${x-16} ${y+4} L${x} ${y-34} L${x+16} ${y+4} Z" fill="${c("sky")}" ${sw}/><path d="M${x-10} ${y-10} L${x+10} ${y-4} M${x-6} ${y-20} L${x+7} ${y-16}" stroke="${color?col("golden"):ink}" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y-36}" r="5" fill="${c("golden")}" ${sw}/>`}
  if(id==="crown"){let s="";for(let i=-2;i<=2;i++){const fx=x+i*w*.2,fy=y+4+Math.abs(i)*4;
    s+=`<g>${[0,72,144,216,288].map(a=>`<circle cx="${(fx+5*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(fy+5*Math.sin(a*Math.PI/180)).toFixed(1)}" r="3.6" fill="${c(i%2?"lavender":"pink")}" stroke="${ink}" stroke-width="1.4"/>`).join("")}<circle cx="${fx}" cy="${fy}" r="2.6" fill="${c("golden")}" stroke="${ink}" stroke-width="1.2"/></g>`}return s}
  if(id==="glasses"){const f=sub.face,r=Math.max(6,8.5*f.s);return`<g fill="none" ${sw.replace("2.4","2")}><circle cx="${f.x-f.dx}" cy="${f.y}" r="${r}"/><circle cx="${f.x+f.dx}" cy="${f.y}" r="${r}"/><path d="M${f.x-f.dx+r} ${f.y} Q${f.x} ${f.y-4} ${f.x+f.dx-r} ${f.y}"/></g>`}
  return"";
}

/* ───────────── color resolution ───────────── */
function palette(sub,o){
  const out={};for(const k in sub.colors){let name=sub.colors[k];if(o.mood==="mine"&&k===sub.main)name=o.mine;out[k]=name}return out}
function colorHex(sub,o,key){
  const name=palette(sub,o)[key];let h=name?col(name):"#cccccc";
  if(o.mood==="pastel")h=lighten(h,.45);return h}

/* ───────────── frame building ─────────────
   A frame is one picture in the guide plus what to say about it. The same subject
   produces a different set of frames for each technique and level. */
function stepsFor(sub,lvl){
  const n=sub.steps.length;const merge=lvl===0&&n>3;
  const map=s=>merge?Math.ceil(s/2):s;
  const N=map(n);const labels=[];
  for(let s=1;s<=n;s++){const m=map(s);labels[m]=labels[m]?labels[m]+", then "+sub.steps[s-1].charAt(0).toLowerCase()+sub.steps[s-1].slice(1):sub.steps[s-1]}
  return{map,N,labels,faceAt:map(sub.faceStep)}}

function build(o){
  const sub=SUB[o.sub],lvl=o.lvl,tech=o.tech,emo=EMOS[o.emo],ex=o.extra!=="none"?EXTRAS.find(e=>e.id===o.extra):null;
  const{N,labels,faceAt}=stepsFor(sub,lvl);
  const scene=SCENES[o.scene==="auto"?sub.scene:o.scene];
  const F=[];const add=(t,p,r,tip)=>F.push({t,p,tip,r:Object.assign({upto:N,style:"outline",face:true,ex:!!ex},r)});
  const faceFrame=(r)=>add(`Give it a ${emo.n.toLowerCase()} face`,emo.how,Object.assign({faceFresh:true},r),
     emo.id==="natural"?"Leave a tiny white dot in each eye. That is the shine that makes eyes look alive.":"Eyebrows and mouths do most of the talking. Try making the face yourself first!");
  const extraFrame=r=>ex&&add(`Add the ${ex.n.toLowerCase()}`,`Draw the ${ex.n.toLowerCase()} on top. This is your own idea, so make it any color you like.`,Object.assign({exFresh:true},r));
  const lineSteps=(r,first)=>{for(let k=1;k<=N;k++){
     add(labels[k],k===1?first:"Look at the orange lines. Those are the new ones for this step.",Object.assign({},r,{upto:k,fresh:k,face:k>faceAt,ex:false}),
        lvl===0?"Trace the dotted line with your finger first, then with your crayon.":k===1?"Press lightly at first. Light lines are easy to fix.":null);
     if(k===faceAt)faceFrame(Object.assign({},r,{upto:k,ex:false}));}};

  if(tech==="draw"){
    if(lvl>=3)add("Find the light","Choose where the sun is shining from. Here it comes from the top left, so shadows land on the bottom right.",{upto:0,face:false,ex:false,light:true,guides:0},"Pros decide the light before drawing a single line.");
    if(lvl>=2)add("Start with helper shapes","Lightly draw circles and ovals where each part goes. They are only helpers, you will erase them later.",{upto:0,face:false,ex:false,guides:1},"Hold the pencil far from the tip so your lines stay light.");
    lineSteps({guides:lvl>=2?2:0,trace:lvl===0},"Start with the biggest shape. Everything else hangs on it.");
    if(lvl>=2)add("Erase the helper shapes","Gently erase the light circles. Now your clean drawing pops out.",{ex:false},null);
    extraFrame({});
    add("Color it in",lvl===0?"Pick your crayons and color each part. Going outside the lines is part of learning!":"Color the big parts first, then the small ones. Keep your strokes going the same direction.",{fill:"color",ex:!!ex},"Open the Color guide to see which colors to mix or pick.");
    if(lvl>=1)add("Add shadows","Press a little harder on the bottom and the side away from the light. That makes it look round.",{fill:"color",shade:"crayon"},lvl===1?"Use the same crayon, just press harder.":"Layer a darker colored pencil on top for shadows.");
    if(lvl>=2)add("Shine and ground shadow","Leave or erase a little white shine on top, and draw a soft shadow on the ground.",{fill:"color",shade:"crayon",hi:true,cast:true},"A white gel pen or white crayon makes great shine.");
  }
  if(tech==="sketch"){
    if(lvl>=2)add("Find the light","Mark where the light comes from with a tiny sun in the corner. Every shadow will go the other way.",{upto:0,face:false,ex:false,light:true,style:"pencil"},null);
    add("Block in with ovals","Use your HB pencil and draw very light circles and ovals for every part.",{upto:0,face:false,ex:false,guides:1,style:"pencil"},"Sketch from your shoulder, not your wrist. Big loose movements!");
    lineSteps({style:"pencil",guides:2,trace:lvl===0},"Go over the helper oval with a firmer, smoother line.");
    add("Clean it up","Erase the extra oval lines so only the outline is left.",{style:"pencil",ex:false},null);
    extraFrame({style:"pencil"});
    add("Hatching","Draw lots of short lines going the same way on the shadow side. Close lines look darker.",{style:"pencil",shade:"hatch"},"Keep hatching lines parallel, like rain falling in the wind.");
    if(lvl>=1)add("Cross-hatching","In the darkest spots, add a second layer of lines that cross the first ones.",{style:"pencil",shade:"hatch2"},"Switch to a softer 2B or 4B pencil for the darkest parts.");
    if(lvl>=2)add("Ground shadow and highlight","Shade a flat shadow under it, then use the eraser to lift a shiny highlight.",{style:"pencil",shade:"hatch2",cast:true,hi:true},"Squint your eyes. If the drawing has light, middle and dark parts, it looks 3D.");
    if(lvl>=3)add("Value check","Squint and compare: is your darkest dark really dark? Push it with 4B if not.",{style:"pencil",shade:"hatch2",cast:true,hi:true,valueScale:true},"Pros use five values: white, light, middle, dark and black.");
  }
  if(tech==="watercolor"){
    add("Light pencil sketch","Draw the whole picture with very light pencil lines. Paint will cover them.",{style:"pencil",face:true,ex:!!ex},"Draw lightly. Dark pencil shows through watercolor.");
    if(lvl>=1&&scene)add("Wet the paper, paint the sky","Brush clean water over the background, then drop in the sky colors and let them run together.",{style:"pencil",bg:"wash",scene},"This is called wet-on-wet. Let the colors do the mixing for you!");
    add("First light layer","Mix lots of water with a little paint. Fill each part with a light, see-through color.",{style:"wash",fill:"pale",bg:lvl>=1&&scene?"wash":null,scene,face:false,ex:false},"Paint big parts with the big brush. Let each part dry before painting the part next to it.");
    if(lvl>=1)add("Second layer for shadows","When it is dry, paint a stronger mix of the same color on the shadow side.",{style:"wash",fill:"pale",shade:"wash",bg:lvl>=1&&scene?"wash":null,scene,face:false,ex:false},"Dry paper = sharp edges. Wet paper = soft edges.");
    add("Face and tiny details","Use your smallest brush, or a pen, for the face and little details.",{style:"wash",fill:"pale",shade:lvl>=1?"wash":0,bg:lvl>=1&&scene?"wash":null,scene,ex:!!ex,faceFresh:true},emo.how);
    if(lvl>=2)add("Outline with a fine pen","Once everything is fully dry, trace the main lines with a fine black pen.",{style:"inked",fill:"pale",shade:"wash",bg:scene?"wash":null,scene},"Broken lines look lovely. You do not need to outline everything.");
    if(lvl>=3)add("Texture and sparkle","Sprinkle salt on a wet area or flick tiny splatters for a pro finish.",{style:"inked",fill:"pale",shade:"wash",bg:scene?"wash":null,scene,splat:true,hi:true},"Brush the salt off only when the paint is completely dry.");
  }
  if(tech==="paint"||tech==="silhouette"){
    const sil=tech==="silhouette";
    if(lvl>=1)add("Paint the sky in stripes","Tape the edges of your paper. Paint each sky color as a stripe, from the top down.",{upto:0,face:false,ex:false,bg:"bands",scene},"Use a flat brush and paint side to side.");
    add(lvl>=1?"Blend the stripes":"Paint the sky","Where two colors meet, brush back and forth while the paint is wet so they melt together.",{upto:0,face:false,ex:false,bg:"blend",scene},"Wipe your brush before each new color so the sky stays bright.");
    add("Add the "+(scene.sky?scene.sky.t:"water")+" and the ground","Paint the ground and let everything dry before the next step.",{upto:0,face:false,ex:false,bg:"blend",scene,ground:true,celestial:true},scene.tip);
    if(sil){
      add("Paint the black shape","Mix black with a touch of blue. Fill the whole "+sub.name.toLowerCase()+" in one dark color, no details inside.",{style:"silhouette",bg:"blend",scene,ground:true,celestial:true,face:false,ex:!!ex},"Silhouettes are all about the outline, so take care with the edges.");
      add("Tiny details","Add birds, grass or stars with your smallest brush.",{style:"silhouette",bg:"blend",scene,ground:true,celestial:true,face:false,ex:!!ex,details:true},"Birds are just a soft letter M.");
      if(lvl>=2)add("Peel the tape","Wait until it is dry, then slowly peel the tape for a clean, neat border.",{style:"silhouette",bg:"blend",scene,ground:true,celestial:true,face:false,ex:!!ex,details:true,border:true},null);
    }else{
      add("Block in the base colors","Paint each part with its main color. No details yet, just flat shapes.",{style:"paint",fill:"color",bg:"blend",scene,ground:true,celestial:true,face:false,ex:false},"Paint the parts at the back first, then the parts in front.");
      if(lvl>=1)add("Paint the shadows","Mix a little darker version of each color and paint the shadow side.",{style:"paint",fill:"color",shade:"paint",bg:"blend",scene,ground:true,celestial:true,face:false,ex:false},"To darken, add a dot of the opposite color or a tiny bit of blue, not lots of black.");
      add("Face and details","Use the small brush for the face, the lines and the extras.",{style:"paint",fill:"color",shade:lvl>=1?"paint":0,bg:"blend",scene,ground:true,celestial:true,faceFresh:true},emo.how);
      if(lvl>=2)add("Highlights","Add white mixed with a little yellow where the light hits. Small and few!",{style:"paint",fill:"color",shade:"paint",hi:true,bg:"blend",scene,ground:true,celestial:true,cast:true},"A highlight on the eyes makes the whole painting come alive.");
      if(lvl>=3)add("Value check","Look at your painting in black and white. Can you still see the shape clearly?",{style:"paint",fill:"color",shade:"paint",hi:true,bg:"blend",scene,ground:true,celestial:true,cast:true,gray:true},"Take a black-and-white photo of your painting to check this.");
      if(lvl>=3)add("Sign your masterpiece","Add a soft glow around the edges facing the light, then sign your name in a corner.",{style:"paint",fill:"color",shade:"paint",hi:true,bg:"blend",scene,ground:true,celestial:true,cast:true,sign:true},null);
    }
  }
  F[F.length-1].last=true;
  return{sub,F,scene};
}

const INK="#2B2622",FRESH="#E2673A",PENCIL="#8D8A86",GUIDE="#7FA9DB";
let uid=0;
function render(o,fr,small){
  const{sub}=o._b||build(o);const r=fr.r;const id="g"+(uid++);
  const lvl=o.lvl;const sc=r.scene;
  const map=stepsFor(sub,lvl).map;
  let defs=`<linearGradient id="${id}sh" x1="0" y1="0" x2="1" y2="1"><stop offset=".35" stop-color="#1E1C22" stop-opacity="0"/><stop offset="1" stop-color="#1E1C22" stop-opacity="${r.shade==="crayon"?.3:.38}"/></linearGradient>
   <radialGradient id="${id}hi" cx=".32" cy=".28" r=".35"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
   <pattern id="${id}h1" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#555" stroke-width="1.3"/></pattern>
   <pattern id="${id}h2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#555" stroke-width="1.3"/><line x1="0" y1="0" x2="5" y2="0" stroke="#555" stroke-width="1"/></pattern>
   <linearGradient id="${id}mg" x1="0" y1="0" x2="1" y2="1"><stop offset=".45" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
   <mask id="${id}m" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#${id}mg)"/></mask>
   <filter id="${id}wc" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
   <filter id="${id}gr"><feColorMatrix type="saturate" values="0"/></filter>`;
  let bg="";
  if(r.bg&&sc){
    const cols=sc.bands.map(k=>{let h=col(k);if(r.bg==="wash")h=lighten(h,.35);return h});

      bg=`<rect width="200" height="200" fill="url(#${id}sky)" ${r.bg==="wash"?`filter="url(#${id}wc)"`:""}/>`}
    if(r.celestial&&sc.sky){const s=sc.sky,c=col(s.c);bg+=s.t==="sun"?`<circle cx="${s.x}" cy="${s.y}" r="${s.r*1.6}" fill="${c}" opacity=".35"/><circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="${c}"/>`
      :`<circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="${c}"/><circle cx="${s.x-s.r*.3}" cy="${s.y-s.r*.2}" r="${s.r*.22}" fill="#000" opacity=".06"/><circle cx="${s.x+s.r*.35}" cy="${s.y+s.r*.3}" r="${s.r*.15}" fill="#000" opacity=".06"/>`}
    if(r.celestial&&sc.stars)bg+=[[20,20],[60,34],[96,14],[120,40],[176,22],[30,62],[84,58],[186,70]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.2" fill="#fff"/>`).join("");
    if(r.ground){const g=r.style==="silhouette"?"#1E1C22":col(sc.g);
      if(sc.ground==="hill")bg+=`<path d="M0 176 Q60 160 110 172 T200 168 L200 200 L0 200 Z" fill="${g}"/>`;
      if(sc.ground==="sea"){bg+=`<rect x="0" y="160" width="200" height="40" fill="${g}"/>`;
        if(sc.sky)bg+=`<path d="M${sc.sky.x-12} 168 L${sc.sky.x+12} 168 M${sc.sky.x-8} 176 L${sc.sky.x+8} 176 M${sc.sky.x-5} 184 L${sc.sky.x+5} 184" stroke="${col(sc.sky.c)}" stroke-width="2" stroke-linecap="round" opacity=".8"/>`}

  }
  if(r.light)bg+=`<g transform="translate(26 26)"><circle r="10" fill="#FFD21F"/>${[0,45,90,135,180,225,270,315].map(a=>`<path d="M${pt(0,0,14,a)} L${pt(0,0,19,a)}" stroke="#F2B33D" stroke-width="2.4" stroke-linecap="round"/>`).join("")}</g><path d="M44 44 L80 80" stroke="#F2B33D" stroke-width="2" stroke-dasharray="4 4"/><path d="M80 80 L72 79 M80 80 L79 72" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"/>`;

  const style=r.style,sil=style==="silhouette",pencil=style==="pencil";
  const lineCol=sil?"#1E1C22":pencil?PENCIL:style==="wash"?"#A9A39A":INK;
  const lineW=small?3.4:(pencil?1.7:style==="wash"?1.2:style==="inked"?1.6:style==="paint"?0:3);
  const visible=sub.parts.map((p,i)=>({p,i,m:map(p.s)})).filter(x=>x.m<=r.upto).sort((a,b)=>a.p.z-b.p.z);
  const fillFor=(key,el)=>{
    if(sil)return"#1E1C22";
    if(key==="none")return"none";
    if(r.fill==="color")return colorHex(sub,o,key);
    if(r.fill==="pale")return lighten(colorHex(sub,o,key),.35);
    return"#FFFFFF"};
  let art="";
  for(const v of visible){
    const fresh=r.fresh===v.m;

  }

  if(r.cast&&sub.base.w)pre+=`<ellipse cx="${sub.base.x+8}" cy="${sub.base.y+2}" rx="${sub.base.w/2+6}" ry="6" fill="${pencil?`url(#${id}h1)`:"#1E1C22"}" opacity="${pencil?.6:.18}"/>`;

    top+=`<g fill="none" stroke="${GUIDE}" stroke-width="${small?2:1.4}" stroke-dasharray="5 4" opacity="${r.guides===2?.45:.95}">${gs.map(g=>`<ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.rx}" ry="${g.ry}"/>`).join("")}</g>`}

  if(r.ex&&o.extra!=="none"){top+=sil?extra(sub,o.extra,"#1E1C22",false).replace(/fill="#fff"/g,'fill="#1E1C22"'):extra(sub,o.extra,r.exFresh&&!r.fill?FRESH:lineCol==="#A9A39A"?"#8a847b":lineCol,r.fill==="color"||r.fill==="pale")}
  if(r.details&&sc){top+=`<path d="M30 60 Q36 54 42 60 Q48 54 54 60 M58 44 Q62 40 66 44 Q70 40 74 44" fill="none" stroke="#1E1C22" stroke-width="2" stroke-linecap="round"/>`
    +[10,22,178,190].map(x=>`<path d="M${x} 200 L${x-3} 178 M${x} 200 L${x+4} 182" stroke="#1E1C22" stroke-width="2" stroke-linecap="round"/>`).join("")}
  if(r.splat)top+=[[30,150,2],[38,158,1.4],[164,40,1.8],[172,50,1.2],[150,174,1.6],[44,40,1.2]].map(([x,y,rr],i)=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="${colorHex(sub,o,Object.keys(sub.colors)[i%Object.keys(sub.colors).length])}" opacity=".7"/>`).join("");
  if(r.valueScale)top+=`<g transform="translate(8 184)">${["#fff","#d9d9d9","#a6a6a6","#666","#222"].map((c,i)=>`<rect x="${i*12}" y="0" width="12" height="10" fill="${c}" stroke="#888" stroke-width=".6"/>`).join("")}</g>`;
  if(r.border)top+=`<rect x="2" y="2" width="196" height="196" fill="none" stroke="#fff" stroke-width="6"/>`;
  if(r.sign)top+=`<text x="190" y="194" text-anchor="end" font-family="Fredoka,sans-serif" font-size="9" fill="${INK}" opacity=".8">${esc(st.artist||"Me")}</text>`;
  return`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(fr.t)}"><defs>${defs}</defs><rect width="200" height="200" fill="#fff"/><g ${r.gray?`filter="url(#${id}gr)"`:""}>${bg}${pre}${art}${top}</g></svg>`;
}

/* Helper shapes are measured from the real parts so they always line up. */
const GUIDES={};
function guides(sub){
  if(GUIDES[sub.id])return GUIDES[sub.id];
  const NS="http://www.w3.org/2000/svg";const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("style","position:absolute;left:-9999px;width:200px;height:200px");svg.setAttribute("viewBox","0 0 200 200");
  document.body.appendChild(svg);const out=[];
  for(const p of sub.parts){svg.innerHTML=p.el;for(const el of svg.children){if(el.getAttribute("data-c")==="none")continue;
    const b=el.getBBox();if(b.width<10||b.height<10)continue;
    out.push({cx:+(b.x+b.width/2).toFixed(1),cy:+(b.y+b.height/2).toFixed(1),rx:+(b.width/2).toFixed(1),ry:+(b.height/2).toFixed(1)})}}
  svg.remove();
  /* keep the biggest dozen so tiny parts don't clutter the helper sketch */
  return GUIDES[sub.id]=out.sort((a,b)=>b.rx*b.ry-a.rx*a.ry).slice(0,12);
}

/* ───────────── colors used by a guide ───────────── */
function usedColors(o){
  const sub=SUB[o.sub];const pal=palette(sub,o);const seen=new Map();
  for(const k in pal){if(!seen.has(pal[k]))seen.set(pal[k],k)}
  return[...seen.keys()];
}

function recipeCard(k){

    <p class="bs-lesson">Start with only red, yellow, blue, white and black. Follow the recipes. Mix a little more than you think you need${o.mood==="pastel"?", and add extra white to every recipe for pastel":""}.</p>
    <div class="bs-colors">${cols.map(recipeCard).join("")}</div>
    ${sc?`<h3 class="bs-sec">Sky recipe: ${esc(sc.n)}</h3><p class="bs-lesson">Paint from the top stripe to the bottom one. ${esc(sc.tip)}</p>
      <div class="bs-colors"><div class="bs-band">${sc.bands.map(k=>{const h=col(k);const dark=rgbOf(h).reduce((a,b)=>a+b)<1.5;return`<div style="background:${h};color:${dark?"#fff":"#2B2622"}"><span>${LIB[k][0]}</span><span>${recText(LIB[k][1])}</span></div>`}).join("")}</div>
      ${[...new Set(sc.bands)].map(recipeCard).join("")}</div>`:""}
    <h3 class="bs-sec">Color friends for this picture</h3>
    <p class="bs-lesson">Colors across from each other on the color wheel make each other pop. Try one of these as the background.</p>
    <div class="bs-pairs">${cols.slice(0,4).map(k=>{const h=col(k);return`<div class="bs-pair" title="${LIB[k][0]} and its opposite"><div style="background:${h}"></div><div style="background:${opposite(h)}"></div></div>`}).join("")}</div>`;
}
function opposite(h){const[r,g,b]=rgbOf(h);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0;const d=mx-mn;
  if(d){if(mx===r)H=((g-b)/d)%6;else if(mx===g)H=(b-r)/d+2;else H=(r-g)/d+4;H*=60;if(H<0)H+=360}
  /* painter's opposite: red↔green, yellow↔purple, blue↔orange */
  const rybH=H<60?H*2:H<120?120+(H-60):H<240?240-(240-H)*.75:H;const opp=(rybH+180)%360;
  const stops=[[0,"R1"],[60,"R1 Y1"],[120,"Y1"],[180,"Y1 B1"],[240,"B1"],[300,"R1 B1"],[360,"R1"]];
  let i=0;while(stops[i+1][0]<opp)i++;const t=(opp-stops[i][0])/60;return lerp(mix(stops[i][1]),mix(stops[i+1][1]),t)}
function padView(F,fr){
  const cols=[...new Set(["charcoal",...usedColors(st)])].slice(0,10);
  return`<div class="bs-pad">
    <div class="bs-padsheet"><img id="bs-ghost" alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(render(st,fr))}" ${padState.ghost?"":"hidden"}><canvas id="bs-canvas" width="800" height="800" aria-label="Drawing space"></canvas></div>
    <div class="bs-tools">
      <h3>Practice step ${st.step+1}</h3>
      <p class="bs-lesson" style="margin:0;font-size:.85rem">${esc(fr.t)}. Turn on the see-through guide to trace it, then turn it off and try on your own.</p>
      <button class="bs-btn ghost" data-ghost aria-pressed="${padState.ghost}">${padState.ghost?"Hide":"Show"} see-through guide</button>
      <div class="bs-swatches" role="group" aria-label="Brush color">${cols.map(k=>`<button class="bs-sw" data-pen="${col(k)}" aria-label="${LIB[k][0]}" aria-pressed="${padState.color===col(k)}" style="background:${col(k)}"></button>`).join("")}<button class="bs-sw" data-pen="eraser" aria-label="Eraser" aria-pressed="${padState.color==="eraser"}" style="background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px"></button></div>
      <div class="bs-sizes" role="group" aria-label="Brush size">${[6,14,30].map(s=>`<button data-size="${s}" aria-pressed="${padState.size===s}" aria-label="Brush size ${s}"><i style="width:${s/2+3}px;height:${s/2+3}px"></i></button>`).join("")}</div>
      <div class="bs-nav"><button class="bs-btn ghost" data-undo>Undo</button><button class="bs-btn ghost" data-clear>Clear</button></div>
      <div class="bs-nav"><button class="bs-btn ghost" data-go="-1" ${st.step===0?"disabled":""}>Back</button><button class="bs-btn" data-go="1" ${fr.last?"disabled":""}>Next step</button></div>
    </div></div>`;
}
const padState={ghost:true,color:mix("K3 W1"),size:6,undo:[]};

/* ───────────── Color Lab ───────────── */
const lab_={drops:{R:0,Y:0,B:0,W:0,K:0},target:"orange"};
const TARGETS=["orange","green","purple","pink","sky","brown","peach","teal","lavender","lime","coral","gray","navy","lightGreen"];
function closeness(a,b){const A=rgbOf(a),B=rgbOf(b);const d=Math.sqrt(A.reduce((s,v,i)=>s+(v-B[i])**2,0));return Math.max(0,Math.round(100-d*140))}
function lab(){
  const cur=mixParts(lab_.drops);const any=Object.values(lab_.drops).some(n=>n);const score=any?closeness(cur,col(lab_.target)):0;
  const wheel=wheelSvg();
  return`<div class="bs-lab">
   <section class="bs-box"><h2>Mixing bowl</h2>
     <p class="bs-lesson">Tap a paint pot to add one drop. Can you mix the color in the target circle?</p>
     <div class="bs-pots">${Object.entries(PAINTS).map(([k,p])=>`<button class="bs-pot" data-drop="${k}" aria-label="Add a drop of ${p.n}"><i style="background:${p.hex};color:${k==="K"||k==="B"||k==="R"?"#fff":"#2B2622"}">${lab_.drops[k]||""}</i>${p.n}</button>`).join("")}</div>
     <div class="bs-bowl">
       <div><div class="blob" style="background:${any?cur:"var(--line-soft)"}" aria-label="Your mix"></div><p style="text-align:center;margin:6px 0 0;font-size:.8rem;font-weight:700">Your mix</p></div>
       <div><div class="blob" style="background:${col(lab_.target)};width:84px;height:84px"></div><p style="text-align:center;margin:6px 0 0;font-size:.8rem;font-weight:700">Target: ${LIB[lab_.target][0]}</p></div>
       <div style="flex:1;min-width:160px"><b style="font-family:var(--display)">${!any?"Add some paint!":score>=92?"You matched it!":score>=75?"So close!":score>=50?"Getting warmer":"Keep mixing"}</b>
         <div class="bs-meter" aria-label="How close"><i style="width:${score}%"></i></div>
         <div class="bs-nav"><button class="bs-btn ghost" data-labreset>Empty the bowl</button><button class="bs-btn ghost" data-labnext>New target</button><button class="bs-btn ghost" data-labhint>Show recipe</button></div>
         <div id="bs-hint" hidden>${recipeCard(lab_.target)}</div>
       </div>
     </div>
   </section>
   <section class="bs-box bs-wheel"><h2>The painter's color wheel</h2>
     <p class="bs-lesson">Three primaries make everything. Mix two neighbors to get the color between them.</p>${wheel}
   </section>
   <section class="bs-box"><h2>Light and dark</h2>
     <p class="bs-lesson">Add white to make a <b>tint</b>. Add black to make a <b>shade</b>. Painters use both to make things look round.</p>
     ${["R1","B1","Y1 B1"].map(r=>`<div class="bs-ladder">${[" W4"," W2"," W1","",""+" K.3"," K.8"].map(x=>`<div style="background:${mix(r+x)}"></div>`).join("")}</div>`).join("")}
   </section>
   <section class="bs-box"><h2>Warm and cool</h2>
     <p class="bs-lesson">Warm colors feel sunny and come forward. Cool colors feel calm and sit back. Use warm for the thing you love, cool for the background.</p>
     <div class="bs-ladder">${["R1","R1 Y1","Y4 R1","Y1"].map(r=>`<div style="background:${mix(r)}"></div>`).join("")}</div>
     <div class="bs-ladder">${["Y1 B1","B2 Y1","B1","R1 B2"].map(r=>`<div style="background:${mix(r)}"></div>`).join("")}</div>
     <h3 class="bs-sec" style="margin-top:12px">Color opposites</h3>
     <div class="bs-pairs">${[["R1","Y1 B1"],["Y1","R1 B1"],["B1","R1 Y1"]].map(([a,b])=>`<div class="bs-pair"><div style="background:${mix(a)}"></div><div style="background:${mix(b)}"></div></div>`).join("")}</div>
     <p class="bs-lesson" style="margin-top:8px">Opposites side by side look extra bright. Mixed together, they turn brown, so keep them apart when painting skies.</p>
   </section>
  </div>
  <h3 class="bs-sec">Sky recipes</h3>
  <div class="bs-skies">${Object.entries(SCENES).map(([k,s])=>`<div class="bs-cell"><div class="bs-sheet">${render({...st,sub:"sun",_b:null},{t:s.n,r:{upto:0,face:false,ex:false,bg:"blend",scene:s,ground:true,celestial:true}},true)}</div>
     <p><b>${esc(s.n)}</b></p><div class="bs-ladder" style="margin:0">${s.bands.map(b=>`<div title="${LIB[b][0]}: ${recText(LIB[b][1])}" style="background:${col(b)}"></div>`).join("")}</div><p style="color:var(--soft)">${esc(s.tip)}</p></div>`).join("")}</div>`;
}
function wheelSvg(){
  const segs=[["R1","Red"],["R2 Y1","Red-orange"],["R1 Y1","Orange"],["Y2 R1","Yellow-orange"],["Y1","Yellow"],["Y2 B1","Yellow-green"],["Y1 B1","Green"],["B2 Y1","Blue-green"],["B1","Blue"],["B2 R1","Blue-violet"],["R1 B1","Violet"],["R2 B1","Red-violet"]];
  let s="";segs.forEach(([r,n],i)=>{const a0=i*30-105,a1=a0+30,R=88,ri=46;const big=i%4===0;
    const p=(rad,a)=>pt(100,100,rad,a);
    s+=`<path d="M${p(ri,a0)} L${p(R,a0)} A${R} ${R} 0 0 1 ${p(R,a1)} L${p(ri,a1)} A${ri} ${ri} 0 0 0 ${p(ri,a0)} Z" fill="${mix(r)}" stroke="var(--card)" stroke-width="2"><title>${n}: ${recText(r)}</title></path>`;
    if(big)s+=`<text x="${pt(100,100,67,a0+15).split(" ")[0]}" y="${pt(100,100,67,a0+15).split(" ")[1]}" text-anchor="middle" dominant-baseline="middle" font-family="Fredoka,sans-serif" font-size="9" font-weight="600" fill="#fff" stroke="#2B2622" stroke-width="2.5" paint-order="stroke">${n}</text>`});
  s+=`<circle cx="100" cy="100" r="40" fill="var(--card)"/><text x="100" y="96" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="11" font-weight="600" fill="var(--ink)">3 primaries</text><text x="100" y="110" text-anchor="middle" font-family="Karla,sans-serif" font-size="8.5" fill="var(--soft)">make all of these</text>`;
  return`<svg viewBox="-6 -6 212 212" role="img" aria-label="Color wheel">${s}</svg>`;
}

/* ───────────── My Gallery ───────────── */
const BADGES=[
 {id:"first",n:"First bloom",d:"Finish your first guide",ok:d=>d.length>=1,c:"#D2566B"},
 {id:"five",n:"Busy brush",d:"Finish 5 guides",ok:d=>d.length>=5,c:"#F2B33D"},
 {id:"ten",n:"Studio star",d:"Finish 10 guides",ok:d=>d.length>=10,c:"#4F86C6"},
 {id:"feel",n:"Feelings artist",d:"Draw 5 different feelings",ok:d=>new Set(d.map(x=>x.emo)).size>=5,c:"#C08A6E"},
 {id:"tech",n:"Explorer",d:"Try all 5 ways to make art",ok:d=>new Set(d.map(x=>x.tech)).size>=5,c:"#8CA079"},
 {id:"pro",n:"Full bloom",d:"Finish a Full Bloom guide",ok:d=>d.some(x=>x.lvl===3),c:"#47533D"},
 {id:"mix",n:"Color wizard",d:"Match a color in the Color Lab",ok:()=>st.labWins>=1,c:"#8a7fcf"},
 {id:"zoo",n:"Little zoo",d:"Make 6 different animals",ok:d=>new Set(d.filter(x=>SUB[x.sub]&&SUB[x.sub].cat==="Animals").map(x=>x.sub)).size>=6,c:"#E2673A"}
];
let confirmReset=false;
function garden(){
  const d=st.done;
  const next=nextIdea();
  return`<section><h2 class="bs-sec" style="margin-top:0">${esc(st.artist?st.artist+"'s":"My")} badges</h2>
   <div class="bs-badges">${BADGES.map(bd=>{const got=bd.ok(d);return`<div class="bs-badge ${got?"got":""}"><svg viewBox="0 0 40 40" aria-hidden="true">${[0,60,120,180,240,300].map(a=>`<circle cx="${(20+11*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(20+11*Math.sin(a*Math.PI/180)).toFixed(1)}" r="7" fill="${got?bd.c:"var(--line)"}"/>`).join("")}<circle cx="20" cy="20" r="7" fill="${got?"#FFD21F":"var(--line-soft)"}"/></svg><div><b>${bd.n}</b><span>${got?"Earned!":bd.d}</span></div></div>`}).join("")}</div>
   <h2 class="bs-sec">Finished artwork <small style="font-family:var(--sans);font-size:.8rem;color:var(--soft)">${d.length} so far</small></h2>
   ${d.length?`<div class="bs-grid">${d.slice().reverse().map(x=>{const t={...st,...x,scene:x.scene||"auto"};if(!SUB[t.sub])return"";const b=build(t);t._b=b;const f=b.F[b.F.length-1];
      return`<div class="bs-cell"><div class="bs-sheet">${render(t,f,true)}</div><p><b>${esc(SUB[t.sub].name)}</b>${esc(TECHS[t.tech].n)} · ${esc(LEVELS[t.lvl].n)}<br><span style="color:var(--soft)">${esc(x.date)}</span></p></div>`}).join("")}</div>`
     :`<div class="bs-empty">Finish any guide in the Studio and press <b>I finished it!</b> Your artwork will hang here.</div>`}
   <h2 class="bs-sec">Try this next</h2>
   <div class="bs-tip" style="max-width:640px">${bulb}<span>${esc(next.text)} <button class="bs-btn" style="margin-left:6px;padding:6px 12px;min-height:34px" data-try='${JSON.stringify(next.set)}'>Let's go</button></span></div>
   ${d.length?(confirmReset?`<div class="bs-confirm">Remove all finished artwork and badges from this device? <button class="bs-btn hot" data-reset="yes">Yes, start over</button><button class="bs-btn ghost" data-reset="no">Keep them</button></div>`
     :`<div class="bs-confirm"><button class="bs-btn ghost" data-reset="ask">Start a fresh gallery</button></div>`):""}
  </section>`;
}
function nextIdea(){
  const d=st.done;const techs=new Set(d.map(x=>x.tech));const missing=TECH.find(t=>!techs.has(t.id));
  const lvlDone=d.filter(x=>x.lvl===st.lvl).length;
  if(lvlDone>=3&&st.lvl<3)return{text:`You've finished ${lvlDone} ${LEVELS[st.lvl].n} guides. You're ready for ${LEVELS[st.lvl+1].n}!`,set:{lvl:st.lvl+1,view:"studio",step:0}};
  if(missing)return{text:`You haven't tried ${missing.n.toLowerCase()} yet. It's a whole new way to make art.`,set:{tech:missing.id,view:"studio",step:0}};
  const emos=new Set(d.map(x=>x.emo));const e=EMO.find(x=>!emos.has(x.id))||EMO[0];
  return{text:`Draw something ${e.n.toLowerCase()} today. How would a ${e.n.toLowerCase()} turtle look?`,set:{emo:e.id,sub:"turtle",cat:"Ocean & Bugs",view:"studio",step:0}};
}

/* ───────────── events ───────────── */
function wire(b){
  root.onclick=e=>{
    const t=e.target.closest("button");if(!t||!root.contains(t))return;const ds=t.dataset;
    const set=(k,v,reset=true)=>{st[k]=v;if(reset)st.step=0;save();draw()};
    if(ds.view)return set("view",ds.view,false);
    if(ds.cat)return set("cat",ds.cat,false);
    if(ds.sub)return set("sub",ds.sub);
    if(ds.lvl)return set("lvl",+ds.lvl);
    if(ds.tech)return set("tech",ds.tech);
    if(ds.emo)return set("emo",ds.emo,false);
    if(ds.extra)return set("extra",ds.extra,false);
    if(ds.mood)return set("mood",ds.mood,false);
    if(ds.mine)return set("mine",ds.mine,false);
    if(ds.scene)return set("scene",ds.scene,false);
    if(ds.mode){padState.undo=[];return set("mode",ds.mode,false)}
    if(ds.go){st.step=Math.max(0,Math.min(b.F.length-1,st.step+ +ds.go));save();padState.undo=[];draw();scrollStage();return}
    if(ds.step){st.step=+ds.step;save();draw();return}
    if(ds.jump){st.step=+ds.jump;st.mode="step";save();draw();scrollStage();return}
    if(ds.say!==undefined){const fr=b.F[st.step];try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`Step ${st.step+1}. ${fr.t}. ${fr.p} ${fr.tip||""}`);u.rate=.92;speechSynthesis.speak(u)}catch(err){}return}
    if(ds.finish!==undefined){finish();return}
    if(ds.pick!==undefined){const a=$(".bs-pick");if(a)a.scrollIntoView();return}
    if(ds.ghost!==undefined){padState.ghost=!padState.ghost;const img=$("#bs-ghost");img.hidden=!padState.ghost;t.setAttribute("aria-pressed",padState.ghost);t.textContent=(padState.ghost?"Hide":"Show")+" see-through guide";return}
    if(ds.pen){padState.color=ds.pen;root.querySelectorAll("[data-pen]").forEach(x=>x.setAttribute("aria-pressed",x===t));return}
    if(ds.size){padState.size=+ds.size;root.querySelectorAll("[data-size]").forEach(x=>x.setAttribute("aria-pressed",x===t));return}
    if(ds.undo!==undefined){const c=$("#bs-canvas");const last=padState.undo.pop();if(c&&last)c.getContext("2d").putImageData(last,0,0);return}
    if(ds.clear!==undefined){const c=$("#bs-canvas");if(c){pushUndo(c);c.getContext("2d").clearRect(0,0,c.width,c.height)}return}
    if(ds.drop){lab_.drops[ds.drop]++;const was=st.labWins;const cur=mixParts(lab_.drops);if(closeness(cur,col(lab_.target))>=92&&!lab_.won){lab_.won=true;st.labWins++;save();party()}draw();return}
    if(ds.labreset!==undefined){lab_.drops={R:0,Y:0,B:0,W:0,K:0};lab_.won=false;draw();return}
    if(ds.labnext!==undefined){let n;do{n=TARGETS[Math.floor(Math.random()*TARGETS.length)]}while(n===lab_.target);lab_.target=n;lab_.drops={R:0,Y:0,B:0,W:0,K:0};lab_.won=false;draw();return}
    if(ds.labhint!==undefined){const h=$("#bs-hint");h.hidden=!h.hidden;return}
    if(ds.reset){if(ds.reset==="ask")confirmReset=true;else if(ds.reset==="yes"){st.done=[];st.labWins=0;confirmReset=false;save()}else confirmReset=false;draw();return}
    if(ds.try){Object.assign(st,JSON.parse(ds.try));save();draw();return}
  };
  const name=$("#bs-artist");if(name)name.oninput=()=>{st.artist=name.value.slice(0,24);save()};
  const c=$("#bs-canvas");if(c)wirePad(c);
}
function scrollStage(){const s=$(".bs-stage");if(s&&s.getBoundingClientRect().top<0)s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
function pushUndo(c){padState.undo.push(c.getContext("2d").getImageData(0,0,c.width,c.height));if(padState.undo.length>20)padState.undo.shift()}
function wirePad(c){
  const ctx=c.getContext("2d");let down=false,lx=0,ly=0;
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{down=true;pushUndo(c);try{c.setPointerCapture(e.pointerId)}catch(err){}[lx,ly]=pos(e);stroke(lx,ly,lx+.1,ly+.1)};
  c.onpointermove=e=>{if(!down)return;const[x,y]=pos(e);stroke(lx,ly,x,y);lx=x;ly=y};
  c.onpointerup=c.onpointercancel=()=>{down=false};
  function stroke(a,b,x,y){ctx.globalCompositeOperation=padState.color==="eraser"?"destination-out":"source-over";
    ctx.strokeStyle=padState.color==="eraser"?"#000":padState.color;ctx.lineWidth=padState.size*(c.width/400);ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(x,y);ctx.stroke()}
}
function finish(){
  const d=new Date();const rec={sub:st.sub,tech:st.tech,lvl:st.lvl,emo:st.emo,extra:st.extra,mood:st.mood,mine:st.mine,scene:st.scene,
    date:d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
  st.done.push(rec);if(st.done.length>200)st.done.shift();save();party();toast(`${st.artist?st.artist+", your":"Your"} ${SUB[st.sub].name.toLowerCase()} is hanging in My Gallery!`);
}
function party(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const p=document.createElement("div");p.className="bs-party";const cs=["#D2566B","#F2B33D","#4F86C6","#8CA079","#C08A6E","#8a7fcf"];
  for(let i=0;i<40;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"vw";s.style.background=cs[i%cs.length];s.style.animationDelay=Math.random()*.6+"s";p.appendChild(s)}
  document.body.appendChild(p);setTimeout(()=>p.remove(),3200);
}
function toast(m){const t=document.createElement("div");t.className="bs-toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

window.BloomStudio={mount(el){root=el;root.classList.add("bs");draw()},mix,build,render,SUBJECTS,EMO,LIB};
const host=document.getElementById("bloom-studio");if(host)window.BloomStudio.mount(host);
})();
</script>
